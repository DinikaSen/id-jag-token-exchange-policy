# Example of attaching mcp-auth-id-jag to a gateway MCP proxy artifact.
#
# Policy order matters: MCP Authentication MUST run first. It validates the
# client's gateway token (client-to-gateway auth) and sets the auth context;
# mcp-auth-id-jag then performs the gateway-to-upstream ID-JAG exchange.
# A request that reaches mcp-auth-id-jag unauthenticated is rejected.
#
# No client secret appears here. Credentials come from the credential set named
# by credentialRef, declared in the gateway's config.toml (examples/config.toml).
# All other values below are placeholders.
apiVersion: gateway.api-platform.wso2.com/v1
kind: McpProxy            # or the API kind your gateway version uses
metadata:
  name: example-mcp-proxy
spec:
  context: /default/example-mcp-proxy
  displayName: Example MCP Proxy
  globalPolicies:
    # 1. Client-to-gateway: validate the inbound gateway token.
    - name: mcp-auth
      version: v1
      params:
        # ...issuer / JWKS / audience settings for your IdP...

    # 2. Gateway-to-upstream: exchange it for a per-user upstream token.
    - name: mcp-auth-id-jag
      version: v0
      params:
        # ─── ID token source (the assertion is always the user's ID token) ───
        # exchange: the client sends only the gateway access token; the policy
        #   exchanges it at the IdP with the openid scope (step 0) and uses the
        #   ID token that comes back.
        # header: the client also sends the user's ID token on idTokenHeader.
        idTokenSource: exchange
        # idTokenHeader: X-ID-Token             # header flow only
        # accessTokenHeader: Authorization      # exchange flow, default
        # exchangeSubjectTokenType: jwt         # exchange flow: jwt | access_token
        # exchangeScopes: openid                # exchange flow; openid is always included

        # ─── Credentials (see examples/config.toml) ───
        credentialRef: atlassian

        # ─── Identity provider ───
        idpTokenEndpoint: https://idp.example.com/oauth2/token
        idpRevocationEndpoint: https://idp.example.com/oauth2/revoke   # exchange flow, optional: revoke the unused step-0 access token
        idpClientAuthMethod: client_secret_basic   # WSO2 IS rejects body creds + Basic together
        audience: https://auth.resource.example.com # the Resource AS issuer identifier
        idpScopes: "read write"                     # optional
        # idpResource: https://auth.resource.example.com   # optional, RFC 8707

        # ─── Resource authorization server ───
        resourceAsTokenEndpoint: https://auth.resource.example.com/oauth/token
        resourceAsClientAuthMethod: client_secret_post
        resourceAsScopes: "read:example write:example"   # optional, must be within the ID-JAG scope

        # ─── Cache (off by default; the ID-JAG and step-0 tokens are never cached) ───
        cacheResourceAccessToken: false
        # cacheMaxEntries: 10000
        # expiryBuffer: 2m
        # tokenPurgeStatusCodes: [401]

        # ─── Injection and transport (defaults shown) ───
        headerName: Authorization
        valuePrefix: Bearer
        tokenRequestTimeout: 10s
        tokenRequestMaxRetries: 2
        defaultTokenTTL: 1h
