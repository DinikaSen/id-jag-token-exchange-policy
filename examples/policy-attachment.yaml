# Example of attaching gateway-id-jag to a gateway API artifact.
#
# Policy order matters: an inbound authentication policy MUST run first so that
# AuthContext.Authenticated is set; gateway-id-jag fails closed with 401
# otherwise (requireAuthContext defaults to true).
#
# All values below are placeholders. Never commit real client secrets: reference
# a secret stored in the gateway / control plane instead of a literal value.
apiVersion: gateway.api-platform.wso2.com/v1
kind: McpProxy            # or the API kind your gateway version uses
metadata:
  name: example-mcp-proxy
spec:
  context: /default/example-mcp-proxy
  displayName: Example MCP Proxy
  globalPolicies:
    # 1. Validate the inbound token (gateway-issued, from the IdP).
    - name: mcp-auth
      version: v1
      params:
        # ...issuer / JWKS / audience settings for your IdP...

    # 2. Exchange it for a per-user upstream token and inject it.
    - name: gateway-id-jag
      version: v0
      params:
        # ─── Step 1: identity provider (RFC 8693 token exchange) ───
        idpTokenEndpoint: https://idp.example.com/oauth2/token
        idpClientId: <gateway-app-client-id-at-idp>
        idpClientSecret: <reference-to-stored-secret>
        idpClientAuthMethod: client_secret_basic   # WSO2 IS rejects body creds + Basic together
        audience: https://auth.resource.example.com # the Resource AS identifier
        subjectTokenType: id_token                  # id_token when the IdP is WSO2 IS
        idpScopes: "read write"                     # optional
        # idpResource: https://auth.resource.example.com   # optional, some IdPs want this too

        # ─── Step 2: resource authorization server (JWT-bearer grant) ───
        resourceAsTokenEndpoint: https://auth.resource.example.com/oauth/token
        resourceAsClientId: <gateway-app-client-id-at-resource-as>
        resourceAsClientSecret: <reference-to-stored-secret>
        resourceAsClientAuthMethod: client_secret_post
        resourceAsScopes: "read:example write:example"   # optional

        # ─── Shared (all optional, defaults shown) ───
        assertionHeader: Authorization
        requireAuthContext: true
        headerName: Authorization
        valuePrefix: Bearer
        tokenRequestTimeout: 10s
        tokenRequestMaxRetries: 2
        defaultTokenTTL: 1h
        expiryBuffer: 2m
        cacheMaxEntries: 10000
        tokenPurgeStatusCodes: [401]
        userIdClaim: sub
        # challengeResourceMetadata: https://gateway.example.com/default/example-mcp-proxy/.well-known/oauth-protected-resource
