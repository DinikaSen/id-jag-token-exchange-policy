# Excerpt of a WSO2 API Platform gateway build manifest (build.yaml) showing how
# to compile this policy into a custom gateway image.
#
# `filePath` is resolved relative to THIS file, not to the directory `ap` is run
# from. Put the contents of this repository at ./policies/mcp-auth-id-jag (or
# add it as a git submodule there) and keep the entry below.
#
# gateway.version is only the TAG applied to the built images; it does not
# select a base image. Bump it on every shipped rebuild so the previous image
# survives as a rollback target; use a throwaway tag while iterating.
version: v1
gateway:
  version: 1.2.0.1
  images:
    builder: <registry>/gateway-builder:<base-version>
    controller: <registry>/gateway-controller:<base-version>
    runtime: <registry>/gateway-runtime:<base-version>
policies:
  # ... the shipped policy set ...

  # Client-to-gateway authentication. Validates the client's gateway token and
  # sets the auth context this policy requires. Must be attached ahead of it.
  - name: mcp-auth
    gomodule: github.com/wso2/gateway-controllers/policies/mcp-auth@v1

  # This policy: gateway-to-upstream, ID-JAG exchange. Local build.
  - name: mcp-auth-id-jag
    filePath: ./policies/mcp-auth-id-jag
