name: mcp-auth-id-jag
version: v0.2.0
displayName: MCP Auth ID-JAG
description: |
  Obtains a per-user access token for an upstream MCP server through the
  Identity Assertion JWT Authorization Grant (ID-JAG) profile
  (draft-ietf-oauth-identity-assertion-authz-grant):
  (1) RFC 8693 token exchange at the Identity Provider (IdP) with an identity
  assertion as the subject token, requesting an ID-JAG for the Resource
  Authorization Server (Resource AS) named by `audience`; then
  (2) RFC 7523 JWT-bearer grant at the Resource AS with the ID-JAG as the
  assertion, yielding the access token that is injected into a request header
  before forwarding.
  The assertion is either an ID token carried on a configurable inbound header,
  or a refresh token the policy first obtains by exchanging the inbound access
  token at the IdP (same client, so the refresh token is bound to the client
  that then requests the ID-JAG). Tokens are obtained just in time per request:
  the ID-JAG and any refresh token are never cached or stored; the final
  Resource AS access token is cached only when `cacheResourceAccessToken` is on.
  Client credentials are never policy parameters - they come from the gateway's
  config.toml / environment as named credential sets selected by `credentialRef`.
  Runs only after the MCP Authentication policy has validated the client's
  gateway token (client-to-gateway auth); this policy is the gateway-to-upstream
  half and has no client-facing behaviour. An IdP rejection of the user's
  credential (invalid_grant, interaction_required) is a 401; every other
  failure is a 502.

parameters:
  type: object
  additionalProperties: false
  required: ["assertionType", "credentialRef", "idpTokenEndpoint", "audience", "resourceAsTokenEndpoint"]
  properties:
    # ─── Assertion source ──────────────────────────────────────────────────
    assertionType:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Which identity assertion is presented to the IdP in the ID-JAG token
        exchange. `id_token`: the inbound request carries the user's ID token
        on the header named by idTokenHeader. `refresh_token`: the policy first
        exchanges the inbound access token (from accessTokenHeader) at the IdP
        for a fresh access token + refresh token, then uses that refresh token
        as the assertion. The IdP must return a refresh token from that
        exchange or the request fails with 502.
      enum:
        - id_token
        - refresh_token
    idTokenHeader:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Header of the inbound request that carries the user's ID token
        (assertionType = id_token). Read from the downstream request snapshot,
        so it is seen even if an earlier policy stripped it. A Bearer scheme
        prefix is tolerated.
      default: "X-ID-Token"
    accessTokenHeader:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      description: |
        Header of the inbound request that carries the validated access token
        exchanged for a refresh token (assertionType = refresh_token). Read
        from the downstream request snapshot. The Bearer scheme prefix is
        stripped case-insensitively.
      default: "Authorization"
    credentialRef:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Name of the credential set to use, as declared in the gateway's
        config.toml under [[policy_configurations.mcp_auth_id_jag_v0.credentials]].
        A set carries the IdP client id/secret and the Resource AS client
        id/secret. Secrets are never entered here.

    # ─── Identity Provider ─────────────────────────────────────────────────
    idpTokenEndpoint:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        URL of the IdP token endpoint used for the RFC 8693 token exchange
        (and, in refresh_token mode, for the preceding access-token exchange).
    idpClientAuthMethod:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How client credentials are sent to the IdP token endpoint.
      enum:
        - client_secret_basic
        - client_secret_post
      default: client_secret_post
    audience:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        Issuer identifier of the Resource AS, sent as the `audience` of the
        ID-JAG token exchange and checked against the ID-JAG's `aud` claim.
    idpScopes:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Space-separated scopes requested in the ID-JAG token exchange. The
        IdP may grant a subset; the granted set is what the ID-JAG carries.
        Optional; omitted from the request when empty.
      default: ""
    idpResource:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        RFC 8707 `resource` parameter for the ID-JAG token exchange
        (identifier of the Resource Server). Optional; omitted when empty.
      default: ""
    idpTokenRequestParams:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties:
        type: string
      description: |
        Extra form fields merged into the ID-JAG token exchange request.
        Cannot override grant_type, subject_token, subject_token_type,
        requested_token_type, audience, scope, or resource.
    idpTokenRequestHeaders:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties:
        type: string
      description: |
        Extra headers sent with every IdP token-endpoint request.
        Authorization and Content-Type are ignored if set here.
    exchangeSubjectTokenType:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        refresh_token mode only. `subject_token_type` the IdP expects for the
        inbound access token in the access-token exchange that yields the
        refresh token. `jwt` sends urn:ietf:params:oauth:token-type:jwt,
        `access_token` sends urn:ietf:params:oauth:token-type:access_token.
      enum:
        - jwt
        - access_token
      default: jwt
    exchangeScopes:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        refresh_token mode only. Space-separated scopes requested in the
        access-token exchange that yields the refresh token. Optional;
        omitted when empty.
      default: ""
    idpRevocationEndpoint:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        refresh_token mode only. RFC 7009 revocation endpoint of the IdP.
        When set, the refresh token obtained for the exchange is revoked as
        soon as the ID-JAG has been issued, so no live refresh token is left
        behind at the IdP. Best effort: a failed revocation is logged, the
        request still succeeds. Empty disables revocation.
      default: ""

    # ─── Resource Authorization Server ─────────────────────────────────────
    resourceAsTokenEndpoint:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        URL of the Resource AS token endpoint for the JWT-bearer grant.
    resourceAsClientAuthMethod:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How client credentials are sent to the Resource AS token endpoint.
      enum:
        - client_secret_basic
        - client_secret_post
      default: client_secret_post
    resourceAsScopes:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Space-separated scopes requested in the JWT-bearer grant. Must be a
        subset of the scopes the ID-JAG carries; a request outside that set
        is rejected before it reaches the Resource AS. Optional; omitted
        when empty, in which case the Resource AS decides from the ID-JAG.
      default: ""
    resourceAsTokenRequestParams:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties:
        type: string
      description: |
        Extra form fields merged into the JWT-bearer request. Cannot
        override grant_type, assertion, or scope.
    resourceAsTokenRequestHeaders:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties:
        type: string
      description: |
        Extra headers sent with the JWT-bearer request. Authorization and
        Content-Type are ignored if set here.

    # ─── Caching (Resource AS access token only) ───────────────────────────
    cacheResourceAccessToken:
      type: boolean
      x-wso2-policy-advanced-param: false
      description: |
        Keep the Resource AS access token in memory, keyed by a hash of the
        inbound assertion (ID token or access token), until it expires, so
        later requests from the same user skip the exchange. Off by default:
        every request then runs the full exchange. The ID-JAG and refresh
        tokens are never cached regardless of this setting.
      default: false
    cacheMaxEntries:
      type: integer
      x-wso2-policy-advanced-param: true
      minimum: 1
      description: |
        Upper bound on cached access tokens when caching is on; the
        earliest-expiring entry is evicted first.
      default: 10000
    expiryBuffer:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How long before expiry a cached access token is re-exchanged early
        (Go duration, e.g. "2m").
      default: "2m"
    tokenPurgeStatusCodes:
      type: array
      x-wso2-policy-advanced-param: true
      items:
        type: integer
        minimum: 100
        maximum: 599
      description: |
        Upstream status codes that purge the requesting user's cached access
        token (that entry only). Only meaningful when caching is on.
        Defaults to [401].
      default: [401]

    # ─── Shared ────────────────────────────────────────────────────────────
    headerName:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      description: |
        Header the Resource AS access token is injected into.
      default: "Authorization"
    valuePrefix:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Prefix prepended to the injected value. Use an empty string for no
        prefix.
      default: "Bearer"
    tokenRequestTimeout:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Timeout for one token-endpoint call (Go duration, e.g. "10s").
        Applied to every step.
      default: "10s"
    tokenRequestMaxRetries:
      type: integer
      x-wso2-policy-advanced-param: true
      minimum: 0
      description: |
        Max retries after a transient token-endpoint failure (network error
        or 429/5xx). Applied to each step independently. Set 0 to disable.
      default: 2
    defaultTokenTTL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Fallback lifetime for a Resource AS access token whose response
        omits expires_in (Go duration, e.g. "1h"). Only used by the cache.
      default: "1h"
    proxyURL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Proxy URL for token-endpoint calls. Defaults to the standard
        HTTP_PROXY/HTTPS_PROXY env vars.
      default: ""
    tlsCaCert:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        PEM CA certificate to trust for the token endpoints' TLS
        connections. Reference a stored secret, not a raw value.
      default: ""
    tlsInsecureSkipVerify:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Disables TLS certificate verification for token endpoints.
        Non-production only.
      default: false

# Gateway-wide configuration, never shown or editable per API. Resolved from
# config.toml at policy load time; config.toml in turn reads each secret from
# the environment (api-platform.env), so no secret is ever written to disk in
# clear text by the platform.
systemParameters:
  type: object
  additionalProperties: false
  properties:
    credentials:
      type: array
      description: |
        Named credential sets. A policy instance selects one by
        `credentialRef`. Each set pairs the gateway's confidential client at
        the IdP with its confidential client at one Resource AS.
      "wso2/defaultValue": "${config.policy_configurations.mcp_auth_id_jag_v0.credentials}"
      items:
        type: object
        additionalProperties: false
        required: ["name", "idpClientId", "idpClientSecret", "resourceAsClientId", "resourceAsClientSecret"]
        properties:
          name:
            type: string
            minLength: 1
            description: Unique name referenced by a policy instance's credentialRef.
          idpClientId:
            type: string
            minLength: 1
            description: Client ID of the gateway's confidential app at the IdP.
          idpClientSecret:
            type: string
            minLength: 1
            description: Client secret paired with idpClientId.
          resourceAsClientId:
            type: string
            minLength: 1
            description: |
              Client ID of the gateway's confidential app at the Resource AS.
              Per the ID-JAG profile this must identify the same client as the
              ID-JAG's client_id claim, i.e. the IdP client.
          resourceAsClientSecret:
            type: string
            minLength: 1
            description: Client secret paired with resourceAsClientId.
